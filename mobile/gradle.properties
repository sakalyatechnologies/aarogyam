org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
# sakalya-mobile 0.1.0 gives every KMP module the namespace com.sakalya.mobile.android (its build
# logic reads the target's name, not the project's). Those modules have no Android resources, so
# the clash is harmless; drop this once a fixed release is pinned.
android.uniquePackageNames=false
