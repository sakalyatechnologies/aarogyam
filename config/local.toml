# Local development defaults for `aarogyam`. Nothing here is secret.
# ARO_* environment variables override any value (see .env.example).
# Deployed services don't read this file; they use environment variables only.

environment = "local"

[http]
bind = "127.0.0.1:8080"

[db]
# The API's login role; row-level security applies to it.
url = "postgres://aarogyam_api@localhost:5432/aarogyam_dev"
# The schema owner, used only by `aarogyam migrate`: a non-superuser shaped like Supabase's
# `postgres`, created by scripts/dev-db.sh, so permission problems show up locally.
owner_url = "postgres://aarogyam_owner@localhost:5432/aarogyam_dev"

[auth]
# Local sign-in: the API mints tokens for the seeded people (POST /api/v1/dev/token).
# For real sign-in locally, also set ARO_AUTH__MODE=supabase and SUPABASE_URL (for example
# `set -a; . ../aarogyam/.env.supabase; set +a`): Supabase tokens then work, and dev tokens
# still do because dev_tokens is on. Deployed servers use mode = "supabase" without dev tokens;
# development tokens refuse to start outside local.
mode = "dev"
audience = "authenticated"
dev_tokens = true
dev_issuer = "aarogyam-dev"
dev_secret = "local-development-secret-not-for-any-deployed-server"

[hosts]
# localtest.me and its subdomains resolve to 127.0.0.1, so host-based tenancy works locally.
portal_host_template = "{slug}.localtest.me"
console = "console.localtest.me"
app = "app.localtest.me"

[edge]
# Every *.localtest.me host already resolves here, so the outbox drain marks new clinics'
# portal addresses ready without calling Cloudflare.
hosts = "wildcard"

[website]
# *.localtest.me resolves to 127.0.0.1 (the site app's dev server answers `<slug>-site.localtest.me:5175`);
# the outbox drain marks site hosts ready like portal hosts. Deployed environments set both
# (docs/deploy.md "Clinic websites").
sites_target = "sites.localtest.me"
address_template = "{slug}-site.localtest.me"

[email]
# No Resend key locally: email from the outbox is recorded as delivered and logged by id.
# Links in messages point at the portal's dev server.
portal_link = "http://{host}:5173"

[telemetry]
format = "pretty"
filter = "debug,hyper=info,sqlx=warn,h2=info"

[cost]
# The console's cost estimate: Cloud Run list prices (USD) and monthly free amounts, tier 1
# (asia-south1); the same values are the code defaults. Check https://cloud.google.com/run/pricing
# The service uses request-based billing (CPU and memory only while serving, plus a fee per
# request); the drain job uses instance-based billing, with its own prices and free tier.
service_vcpu_second_usd = 0.000024
service_gib_second_usd = 0.0000025
service_million_requests_usd = 0.40
service_free_vcpu_seconds = 180000.0
service_free_gib_seconds = 360000.0
service_free_requests = 2000000.0
job_vcpu_second_usd = 0.000018
job_gib_second_usd = 0.000002
job_free_vcpu_seconds = 240000.0
job_free_gib_seconds = 450000.0
# Internet egress, premium tier, first TiB. Cloud Run's free GiB is for North America only.
egress_gib_usd = 0.12
egress_free_gib = 0.0
# Rupees per dollar for the INR figures; GST is shown separately.
inr_per_usd = 88.0
gst_percent = 18.0
