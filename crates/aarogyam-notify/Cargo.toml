[package]
name = "aarogyam-notify"
description = "Delivers the outbox: message templates, channels (email by Resend, or a local log), retries, and clinic portal addresses at the edge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
aarogyam-app = { path = "../aarogyam-app" }
aarogyam-dal = { path = "../aarogyam-dal" }
aarogyam-domain = { path = "../aarogyam-domain" }
aws-lc-rs.workspace = true
base64.workspace = true
# PEM keys: the APNs .p8 and the Google service account's private key.
jsonwebtoken = { workspace = true, features = ["use_pem"] }
# APNs speaks HTTP/2 only.
reqwest = { workspace = true, features = ["http2"] }
sakalya-db.workspace = true
sakalya-types.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
