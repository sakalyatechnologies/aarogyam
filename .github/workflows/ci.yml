name: ci

# Parked until CI/CD is set up (see docs/cicd.md); the local pre-commit hook is the gate.
# To un-park, trigger on pull_request and on push to main, both with these paths:
#   paths: ["crates/**", "Cargo.*", "db/**", "config/**", "deny.toml", "rust-toolchain.toml",
#           "docs/api/**", "docs/schema/**", "scripts/gen_schema_docs.py", ".github/workflows/ci.yml"]
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: sakalyatechnologies/sakalya-backend/.github/workflows/rust-ci.yml@v0.1.0

  schema-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Database docs match the model
        run: python3 scripts/gen_schema_docs.py && git diff --exit-code docs/database.md docs/schema/schema.json
