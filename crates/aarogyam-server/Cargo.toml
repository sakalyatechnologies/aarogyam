[package]
name = "aarogyam-server"
description = "The aarogyam binary: configuration, telemetry and wiring for the API and migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "aarogyam"
path = "src/main.rs"

[dependencies]
aarogyam-api.workspace = true
aarogyam-app = { path = "../aarogyam-app" }
aarogyam-dal.workspace = true
aarogyam-notify = { path = "../aarogyam-notify" }
anyhow.workspace = true
clap.workspace = true
sakalya-auth.workspace = true
sakalya-config.workspace = true
sakalya-db.workspace = true
sakalya-http.workspace = true
sakalya-telemetry.workspace = true
sakalya-throttle.workspace = true
secrecy.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
