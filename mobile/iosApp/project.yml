# The Aarogyam staff app for iOS. Generate the Xcode project with `xcodegen generate`; the
# .xcodeproj is git-ignored and never edited by hand.
name: AarogyamStaff
options:
  bundleIdPrefix: com.aarogyam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 3
    # The Gradle and secrets phases read files outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # The static Kotlin framework, built by the first phase for this configuration and SDK.
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
packages:
  SakalyaUI:
    path: ../.deps/sakalya-mobile/ios/SakalyaUI
  # Crashlytics and Analytics (no IDFA: FirebaseAnalyticsIdentitySupport is left out). The config
  # goes into Release builds only (scripts/copy-firebase-config.sh).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
targets:
  AarogyamStaff:
    type: application
    platform: iOS
    sources:
      - AarogyamStaff
    dependencies:
      - package: SakalyaUI
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/build-shared.sh"'
      - name: Write the Supabase settings
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/write-build-settings.sh"'
      - name: Copy the Firebase config (Release only)
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/copy-firebase-config.sh"'
    postBuildScripts:
      - name: Upload Crashlytics symbols (Release only)
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/upload-crashlytics-symbols.sh"'
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarogyam.ios
        TARGETED_DEVICE_FAMILY: "1"
        # Interim store icon (docs/release.md); replace AppIcon-1024.png with the approved artwork.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [-framework, AarogyamShared]
        GENERATE_INFOPLIST_FILE: NO
        # Push: `aps-environment` is `development` here; an exported App Store build gets `production`.
        CODE_SIGN_ENTITLEMENTS: AarogyamStaff/AarogyamStaff.entitlements
        # Which API the build talks to: Local, Demo or Prod (as Android's flavours).
        AAROGYAM_ENVIRONMENT: Demo
        # `AARO_ENV_Local`, `AARO_ENV_Demo` or `AARO_ENV_Prod`: only `DEBUG && AARO_ENV_Local` compiles
        # the development sign-in in.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AARO_ENV_$(AAROGYAM_ENVIRONMENT)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.aarogyam.ios.demo
        Release:
          AAROGYAM_ENVIRONMENT: Prod
    info:
      path: AarogyamStaff/Info.plist
      properties:
        CFBundleDisplayName: Aarogyam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AarogyamEnvironment: $(AAROGYAM_ENVIRONMENT)
        UILaunchScreen: {}
        # `aarogyam://invite#<token>` opens an invitation (the app handles it in AppModel).
        CFBundleURLTypes:
          - CFBundleURLName: com.aarogyam.ios
            CFBundleURLSchemes: [aarogyam]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # "Send on WhatsApp" checks for WhatsApp before asking the server for the summary.
        LSApplicationQueriesSchemes: [whatsapp]
        ITSAppUsesNonExemptEncryption: false
        # Firebase: no ad signals, no ad-network registration, no IDFV, and no swizzling of the
        # push delegate (push stays ours, through APNs).
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_REGISTRATION_WITH_AD_NETWORK_ENABLED: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        FirebaseAppDelegateProxyEnabled: false
        NSCameraUsageDescription: Take photos of teeth and X-rays for the patient's record. Photos are resized on the phone and sent to your clinic only.
        NSSpeechRecognitionUsageDescription: Dictate visit notes. Speech is turned into text on the phone when the language allows it, and the recording is never kept.
        NSMicrophoneUsageDescription: Dictate visit notes by voice. The microphone is only on while you dictate, and the recording is never kept.
        # Who Help writes to; the WhatsApp number is empty until the support line exists.
        AarogyamSupportEmail: support@aarogyam.example
        AarogyamSupportWhatsApp: ""
        # The local flavour's Vite server; the shared code refuses cleartext outside debug builds.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localtest.me:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
  AarogyamStaffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AarogyamStaffTests
    dependencies:
      - target: AarogyamStaff
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aarogyam.ios.tests
  # T12: the two-phone visit, driven by scripts/e2e-visit.sh against the local API. Not in the gate's scheme.
  AarogyamStaffE2E:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AarogyamStaffE2E
    dependencies:
      - target: AarogyamStaff
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aarogyam.ios.e2e
        TEST_TARGET_NAME: AarogyamStaff
schemes:
  AarogyamStaff:
    build:
      targets:
        AarogyamStaff: all
        AarogyamStaffTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AarogyamStaffTests
  AarogyamStaffE2E:
    build:
      targets:
        AarogyamStaff: all
        AarogyamStaffE2E: [test]
    test:
      config: Debug
      targets:
        - AarogyamStaffE2E
