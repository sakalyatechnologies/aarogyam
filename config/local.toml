# Local development defaults for `aarogyam`. Nothing here is secret.
# ARO_* environment variables override any value (see .env.example).
# Deployed services don't read this file; they use environment variables only.

environment = "local"

[http]
bind = "127.0.0.1:8080"

[db]
# The API's login role; row-level security applies to it.
url = "postgres://aarogyam_api@localhost:5432/aarogyam_dev"
# The schema owner, used only by `aarogyam migrate`: a non-superuser shaped like Supabase's
# `postgres`, created by scripts/dev-db.sh, so permission problems show up locally.
owner_url = "postgres://aarogyam_owner@localhost:5432/aarogyam_dev"

[auth]
# Local sign-in: the API mints tokens for the seeded people (POST /api/v1/dev/token).
# Deployed servers use mode = "supabase" with jwks_url; dev mode refuses to start there.
mode = "dev"
issuer = "aarogyam-dev"
audience = "authenticated"
dev_secret = "local-development-secret-not-for-any-deployed-server"

[hosts]
# localtest.me and its subdomains resolve to 127.0.0.1, so host-based tenancy works locally.
portal_domain = "localtest.me"
console = "console.localtest.me"
app = "app.localtest.me"

[email]
# No Resend key locally: email from the outbox is recorded as delivered and logged by id.
# Links in messages point at the portal's dev server.
portal_link = "http://{host}:5173"

[telemetry]
format = "pretty"
filter = "debug,hyper=info,sqlx=warn,h2=info"
