# The Aarogyam staff app for iOS. Generate the Xcode project with `xcodegen generate`; the
# .xcodeproj is git-ignored and never edited by hand.
name: AarogyamStaff
options:
  bundleIdPrefix: com.aarogyam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # The Gradle and secrets phases read files outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # The static Kotlin framework, built by the first phase for this configuration and SDK.
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
packages:
  SakalyaUI:
    path: ../.deps/sakalya-mobile/ios/SakalyaUI
targets:
  AarogyamStaff:
    type: application
    platform: iOS
    sources:
      - AarogyamStaff
    dependencies:
      - package: SakalyaUI
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/build-shared.sh"'
      - name: Write the Supabase settings
        basedOnDependencyAnalysis: false
        script: '"$SRCROOT/scripts/write-build-settings.sh"'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarogyam.staff
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: [-framework, AarogyamShared]
        GENERATE_INFOPLIST_FILE: NO
        # Which API the build talks to: Local, Demo or Prod (as Android's flavours).
        AAROGYAM_ENVIRONMENT: Demo
        # `AARO_ENV_Local`, `AARO_ENV_Demo` or `AARO_ENV_Prod`: only `DEBUG && AARO_ENV_Local` compiles
        # the development sign-in in.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AARO_ENV_$(AAROGYAM_ENVIRONMENT)"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.aarogyam.staff.demo
        Release:
          AAROGYAM_ENVIRONMENT: Prod
    info:
      path: AarogyamStaff/Info.plist
      properties:
        CFBundleDisplayName: Aarogyam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AarogyamEnvironment: $(AAROGYAM_ENVIRONMENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos of teeth and X-rays for the patient's record. Photos are resized on the phone and sent to your clinic only.
        # The local flavour's Vite server; the shared code refuses cleartext outside debug builds.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localtest.me:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
  AarogyamStaffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AarogyamStaffTests
    dependencies:
      - target: AarogyamStaff
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aarogyam.staff.tests
schemes:
  AarogyamStaff:
    build:
      targets:
        AarogyamStaff: all
        AarogyamStaffTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AarogyamStaffTests
