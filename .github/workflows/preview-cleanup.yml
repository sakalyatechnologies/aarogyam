# Removes a pull request's preview tag from the staging service when the PR closes.
name: preview-cleanup

# Parked until CI/CD is set up (see docs/cicd.md); the local pre-commit hook is the gate.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run services update-traffic aarogyam-api --project "${{ vars.GCP_PROJECT_ID }}" \
            --region asia-south1 --remove-tags "pr-${{ github.event.pull_request.number }}" --quiet || true
