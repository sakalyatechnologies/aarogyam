# Pull request -> preview revision on staging with its own URL, commented on the PR.
# Merge to main -> build once -> staging (100%) -> production canary after one approval.
name: deploy-api

# Parked until CI/CD is set up (see docs/cicd.md); the local pre-commit hook is the gate.
on:
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: sakalyatechnologies/sakalya-backend/.github/workflows/rust-ci.yml@v0.1.0

  build:
    needs: ci
    uses: sakalyatechnologies/sakalya-backend/.github/workflows/build-image.yml@v0.1.0
    with:
      image: ${{ vars.IMAGE_REGISTRY }}/aarogyam-api

  preview:
    if: github.event_name == 'pull_request'
    needs: build
    uses: sakalyatechnologies/sakalya-backend/.github/workflows/deploy-cloud-run.yml@v0.1.0
    with:
      environment: staging
      service: aarogyam-api
      image: ${{ needs.build.outputs.image }}
      mode: preview

  staging:
    if: github.event_name == 'push'
    needs: build
    uses: sakalyatechnologies/sakalya-backend/.github/workflows/deploy-cloud-run.yml@v0.1.0
    with:
      environment: staging
      service: aarogyam-api
      image: ${{ needs.build.outputs.image }}
      mode: promote

  production:
    if: github.event_name == 'push'
    needs: [build, staging]
    uses: sakalyatechnologies/sakalya-backend/.github/workflows/deploy-cloud-run.yml@v0.1.0
    with:
      environment: production
      service: aarogyam-api
      image: ${{ needs.build.outputs.image }}
      mode: canary
