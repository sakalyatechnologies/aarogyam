[advisories]
version = 2

[licenses]
version = 2
# Our crates and the sakalya-backend crates are private (publish = false) and carry no licence.
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own private crates have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The shared Sakalya crates, depended on by tag.
allow-git = ["https://github.com/sakalyatechnologies/sakalya-backend"]
